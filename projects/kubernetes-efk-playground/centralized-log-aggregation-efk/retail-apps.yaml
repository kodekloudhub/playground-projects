apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["/bin/sh", "-c", "pip install --no-cache-dir -r /app/requirements.txt && python /app/app.py"]
          volumeMounts:
            - name: code
              mountPath: /app
            - name: templates
              mountPath: /app/templates
      volumes:
        - name: code
          configMap:
            name: frontend-code
        - name: templates
          configMap:
            name: frontend-templates
---
