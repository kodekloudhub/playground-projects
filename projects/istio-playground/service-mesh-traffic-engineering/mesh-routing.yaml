apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payment-destinations
spec:
  host: payment-service
  subsets:
  - name: production-v1
    labels:
      version: v1
  - name: canary-v2
    labels:
      version: v2
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payment-traffic-splitter
spec:
  hosts:
  - payment-service
  http:
  - route:
    - destination:
        host: payment-service
        subset: production-v1
      weight: 90
    - destination:
        host: payment-service
        subset: canary-v2
      weight: 10
