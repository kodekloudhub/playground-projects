# ==========================================
# 1. SECURE REDIS JOB QUEUE BROKER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-broker
  labels:
    app: redis-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue
  template:
    metadata:
      labels:
        app: redis-queue
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master # Accessible via redis-master.default.svc.cluster.local
spec:
  type: ClusterIP   # Completely isolated from public internet traffic
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-queue
---
# ==========================================
# 2. PYTHON WORKER TIERS (Heavy Computations)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-doc-worker
  labels:
    tier: background-worker
spec:
  replicas: 2 # Scale up to process jobs in parallel
  selector:
    matchLabels:
      app: doc-worker
  template:
    metadata:
      labels:
        app: doc-worker
    spec:
      containers:
      - name: worker
        image: kodekloud/python-worker:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        env:
        - name: REDIS_HOST
          value: "redis-master"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
---
# ==========================================
# 3. NODE.JS WEB FRONTEND API
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-frontend-api
  labels:
    tier: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-api
  template:
    metadata:
      labels:
        app: frontend-api
    spec:
      containers:
      - name: node-api
        image: kodekloud/node-frontend-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_HOST
          value: "redis-master"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-master:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-api-service
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30082 # Explicit port for verification
  selector:
    app: frontend-api
