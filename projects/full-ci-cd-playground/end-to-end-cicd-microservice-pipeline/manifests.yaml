kind: Secret
metadata:
  name: private-reg-cred
type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: weather-advisory
spec:
  selector:
    matchLabels:
      app: weather-advisory
  replicas: 2
  template:
    metadata:
      labels:
        app: weather-advisory
    spec:
      imagePullSecrets: 
      - name: private-reg-cred
      containers:
        - name: weather-api
          image: docker-host:5000/weather-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000 
---
apiVersion: v1
kind: Service 
metadata: 
  name: weather-advisory-svc
spec:
  type: NodePort
  selector:
    app: weather-advisory
  ports:
    - port: 5000 
      targetPort: 5000
      nodePort: 30050
