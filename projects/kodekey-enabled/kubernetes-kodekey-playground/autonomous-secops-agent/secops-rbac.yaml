apiVersion: v1
kind: ServiceAccount
metadata:
  name: secops-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-streamer-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secops-agent-rbac-bind
  namespace: default
subjects:
  - kind: ServiceAccount
    name: secops-agent-sa
    namespace: default
roleRef:
  kind: Role
  name: log-streamer-role
  apiGroup: rbac.authorization.k8s.io
